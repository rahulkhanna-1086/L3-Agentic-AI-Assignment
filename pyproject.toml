[project]
name = "enterprise-knowledge-assistant"
version = "1.0.0"
description = "Enterprise Knowledge Assistant using LangGraph, RAGAS, and MCP"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "datasets>=4.0,<5",
    "fastmcp>=3.4,<4",
    "langchain-chroma>=1.0,<2",
    "langchain-core>=1.2,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "ragas>=0.4,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

